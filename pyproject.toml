[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terragaze"
version = "0.1.0"
description = "TerraGaze multimodal model training stack."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
    "transformers==4.55.0",
    "tokenizers==0.21.4",
    "huggingface-hub==0.34.3",
    "safetensors==0.5.3",
    "sentencepiece==0.2.0",
    "einops==0.8.2",
    "timm==1.0.19",
    "numpy==2.2.6",
    "pillow==11.3.0",
    "pyyaml==6.0.2",
    "tqdm==4.67.1",
    "requests==2.32.4",
    "packaging==25.0",
    "psutil==7.2.2",
]

[project.optional-dependencies]
eval = [
    "datasets==4.0.0",
    "matplotlib==3.10.9",
    "shapely==2.1.1",
]
sft = [
    "accelerate==1.9.0",
    "datasets==4.0.0",
    "deepspeed==0.17.4",
    "flash_attn==2.8.3",
    "triton==3.3.0",
    "ninja==1.13.0",
    "mmengine==0.10.7",
    "opencv-python==4.12.0.88",
    "imageio==2.37.0",
    "decord==0.6.0",
    "scipy==1.15.3",
    "pandas==2.3.1",
    "pyarrow==21.0.0",
    "fsspec==2025.3.0",
    "regex==2025.7.34",
    "protobuf==6.31.1",
    "shapely==2.1.1",
    "wandb==0.25.1",
    "tensorboard==2.20.0",
    "peft==0.17.1",
    "bitsandbytes==0.46.1",
]
openr1 = [
    "scipy==1.15.3",
    "trl==0.20.0",
    "vllm==0.9.2",
]
s3 = [
    "boto3==1.40.3",
    "botocore==1.40.3",
    "s3transfer==0.13.1",
]
build = ["build==1.5.0", "twine==6.2.0"]
dev = ["ipython==8.37.0", "ipdb==0.13.13", "yapf==0.43.0"]

[tool.setuptools.packages.find]
include = ["terragaze*"]
namespaces = true
exclude = ["assets*", "benchmark*", "docs", "images", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "images", "dist*", "playground*", "scripts*", "tests*"]
